<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>拼音语音自测 1.3</title><style>body{margin:0;background:#071426;color:white;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;text-align:center}.app{max-width:900px;margin:auto;padding:28px}.top{color:#ffd24d;display:flex;justify-content:space-between}.q{font-size:clamp(34px,6vw,62px);margin:42px 0 20px}.hint{color:#bcd0e8;font-size:18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}.a{border:0;border-radius:18px;background:#102b4a;color:#fff;font-weight:800;font-size:clamp(24px,4vw,40px);padding:25px}.good{background:#087a50}.bad{background:#ad394a}.status{min-height:100px;font-size:23px;padding:25px}.ctrl{border:2px solid #ffd24d;background:transparent;color:#ffd24d;border-radius:12px;padding:12px 18px;font-size:17px}@media(max-width:600px){.app{padding:18px}.a{padding:17px}}</style><main class='app' id='app'></main><script>const Q=[['下列哪一个是声母？',['i','f','ü','wu'],1,'f 是声母；i、ü 是单韵母。'],['ang 属于哪一类？',['前鼻韵母','后鼻韵母','复韵母','声母'],1,'ang 以 ng 结尾，是后鼻韵母。'],['下列哪一个是整体认读音节？',['zh','ai','zhi','en'],2,'zhi 是整体认读音节。'],['“xue” 的声母是哪一个？',['x','u','e','ue'],0,'xue 的声母是 x。'],['“guo” 的韵母是哪一个？',['g','u','o','uo'],3,'guo 的韵母是 uo。']];let n=0,s=0,lock=false;function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';speechSynthesis.speak(u)}function draw(){if(n===Q.length){app.innerHTML=`<h1 class='q'>测验完成！</h1><h2 style='font-size:100px;color:#ffd24d'>${s}</h2><p class='status'>答对 ${s/20} 题，共 5 题</p><button class='a' onclick='n=0;s=0;draw()'>再测一次</button>`;say('测验完成，你得到'+s+'分');return}let x=Q[n];app.innerHTML=`<div class='top'><b>拼音语音自测 1.3</b><span>第 ${n+1}/5 题　${s} 分</span></div><h1 class='q'>${x[0]}</h1><p class='hint'>在 iPhone 上轻点答案；AirPlay 会同步显示到电视。</p><div class='answers'>${x[1].map((v,i)=>`<button class='a' onclick='ans(${i})'>${['一','二','三','四'][i]}．${v}</button>`).join('')}</div><div class='status' id='st'>请选择答案</div><button class='ctrl' onclick='say(Q[n][0])'>🔊 读题</button><p class='hint'>同一 Wi‑Fi：iPhone 控制中心 → 屏幕镜像 → 选择小米电视。</p>`;setTimeout(()=>say(x[0]),300)}function ans(i){if(lock)return;lock=true;let x=Q[n],b=[...document.querySelectorAll('.a')],ok=i===x[2];b[x[2]].classList.add('good');if(!ok)b[i].classList.add('bad');if(ok)s+=20;st.innerHTML=`<b>${ok?'回答正确！':'回答错误。'}</b><br>${x[3]}<br><small>2.5 秒后自动下一题</small>`;say((ok?'回答正确。':'回答错误。')+x[3]);setTimeout(()=>{n++;lock=false;draw()},2500)}draw()</script></html>
