<!doctype html><meta charset="utf-8"><title>汉语拼音语音自测 1.3版</title><style>body{margin:0;background:#071426;color:#fff;font-family:Microsoft YaHei}.w{max-width:1200px;margin:auto;padding:28px}.c{max-width:1080px;margin:6vh auto;padding:38px;background:#102440;border:2px solid #46709a;border-radius:25px;text-align:center}h1{font-size:46px}.hide{display:none}.q{font-size:46px;text-align:left;font-weight:bold;margin:22px 0}.ops{display:grid;grid-template-columns:1fr 1fr;gap:18px}.op,button{font:inherit;font-weight:bold;cursor:pointer;border-radius:18px;border:3px solid #52789f}.op{font-size:38px;text-align:left;min-height:110px;background:#163154;color:white;padding:18px}.op i{font-style:normal;background:#315474;border-radius:50%;padding:9px 17px;margin-right:14px}.good{background:#174e3e;border-color:#39d98a}.bad{background:#592c38;border-color:#ff7181}button{font-size:25px;background:#ffd04a;color:#16253a;padding:14px 22px;margin:7px}.gray{background:#274868;color:#fff}.voice{background:#b08aff}.box{text-align:left;font-size:22px;line-height:1.65;background:#0a1d34;border-radius:14px;padding:16px;margin:16px 0}.tip{background:#193b5c;border-left:7px solid #ffd04a}.top{display:flex;justify-content:space-between;font-size:21px}.bar{height:14px;background:#294865}.bar i{display:block;height:100%;background:#ffd04a}.score{font-size:110px;font-weight:900;color:#ffd04a;margin:10px}@media(max-width:700px){.ops{grid-template-columns:1fr}.q{font-size:33px}.op{font-size:28px}.score{font-size:80px}}</style><div class="w"><section class="c" id="h"><h1>汉语拼音语音自测 1.3版</h1><p class="box tip">📺 iPhone 投屏电视：iPhone 与电视连同一 Wi-Fi → 控制中心 → 屏幕镜像 → 选电视。手机上点选项或说话，电视同步显示。</p><p class="box" id="audit"></p><button onclick="start(10)">每日 10 题</button><button onclick="start(30)">强化 30 题</button><button onclick="start(100)">挑战 100 题</button></section><section class="c hide" id="z"><div class="top"><span id="type"></span><span id="num"></span></div><div class="bar"><i id="bar"></i></div><div class="q" id="q"></div><div class="ops" id="ops"></div><div class="box tip" id="tip"></div><div class="box" id="info"></div><button class="voice" onclick="voice()">🎙️ 读题并说答案</button><button class="gray" onclick="say(read())">重读题目</button><button class="gray" onclick="home()">🏠 返回主页</button></section><section class="c hide" id="r"><h1 id="title">🎉 测验完成！</h1><div class="score" id="score"></div><p class="q" style="text-align:center" id="detail"></p><p class="box" id="summary"></p><button id="fix" onclick="fix()">开始纠错练习</button><button onclick="start(N)">再来一套</button><button class="gray" onclick="home()">🏠 返回主页</button></section></div><script>const G={声母:['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w'],单韵母:['a','o','e','i','u','ü'],复韵母:['ai','ei','ui','ao','ou','iu','ie','üe','er'],前鼻韵母:['an','en','in','un','ün'],后鼻韵母:['ang','eng','ing','ong'],整体认读音节:['zhi','chi','shi','ri','zi','ci','si','yi','wu','yu','ye','yue','yuan','yin','yun','ying']},C=Object.keys(G),R=Object.fromEntries(C.flatMap(c=>G[c].map(x=>[x,c]))),X=Object.keys(R),T={声母:'家长提示：声母站前面，韵母站后面。',单韵母:'家长提示：a、o、e、i、u、ü。口诀：阿哦鹅，衣乌迂。',复韵母:'家长提示：两个元音手拉手，就是复韵母。',前鼻韵母:'家长提示：n 在前，舌尖顶牙。',后鼻韵母:'家长提示：ng 在后，舌根抬高。',整体认读音节:'家长提示：整体认读不用拼，见到马上整体读。'},$=x=>document.getElementById(x),mix=a=>[...a].sort(()=>Math.random()-.5),one=a=>a[Math.random()*a.length|0];let B=[];for(let i=0;i<1000;i++){let c=C[i%6],x=one(G[c]),o=mix([x,...mix(X.filter(y=>R[y]!=c)).slice(0,3)]);if(o.filter(y=>R[y]==c).length!=1)throw Error();B.push({c,x,o,a:o.indexOf(x)})}$('audit').textContent='题库审计完成：1000 题均只有一个正确答案。';let Q,A,at,N,timer,wrong=[];function say(s,d){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.onend=d;speechSynthesis.speak(u)}function read(){let x=Q[at];return'第'+(at+1)+'题。下列哪一个是'+x.c+'？'+x.o.map((v,i)=>'第'+(i+1)+'项，'+v).join('。')}function draw(){let x=Q[at];$('type').textContent=x.c;$('num').textContent='第 '+(at+1)+' / '+N;$('bar').style.width=(at+1)/N*100+'%';$('q').textContent='下列哪一个是'+x.c+'？';$('tip').textContent=T[x.c];$('info').textContent='可说”选一”到”选四”，或直接点选项。语音不可用时，直接触屏点答案即可。';$('ops').innerHTML='';x.o.forEach((v,i)=>{let b=document.createElement('button');b.className='op';b.innerHTML='<i>'+(i+1)+'</i>'+v;b.onclick=()=>ans(i);$('ops').append(b)})}function ans(i){if(A[at]!=null)return;A[at]=i;let x=Q[at],bs=[...$('ops').children];bs[x.a].classList.add('good');if(i!=x.a)bs[i].classList.add('bad');let msg=i==x.a?'回答正确！1 秒后自动进入下一题。':'回答错误。正确答案是第 '+(x.a+1)+' 项，'+x.o[x.a]+'。'+T[x.c]+' 1 秒后自动进入下一题。';$('info').textContent=msg;say(i==x.a?'回答正确。':msg,()=>timer=setTimeout(next,1000))}function next(){clearTimeout(timer);if(at==N-1)return done();at++;draw();say(read())}function start(n){N=n;Q=mix(B).slice(0,n);A=Array(n).fill(null);at=0;$('h').classList.add('hide');$('r').classList.add('hide');$('z').classList.remove('hide');draw();say(read())}function done(){wrong=Q.filter((x,i)=>A[i]!=x.a);let right=N-wrong.length,score=Math.round(right/N*100),msg=score==100?'太厉害了！全部答对！':score>=90?'非常棒！只差一点点就满分了！':score>=80?'很不错！你已经掌握得很好了！':score>=60?'继续加油！错题再练一遍就会更棒！':'你已经认真完成练习了，我们一起把错题练会！';$('z').classList.add('hide');$('r').classList.remove('hide');$('score').textContent=score+' 分';$('detail').textContent='答对 '+right+' 题，共 '+N+' 题';$('summary').textContent=msg;$('fix').classList.toggle('hide',!wrong.length);say('测验完成。你获得'+score+'分。'+msg)}function fix(){Q=wrong;N=Q.length;A=Array(N).fill(null);at=0;$('r').classList.add('hide');$('z').classList.remove('hide');draw();say('开始纠错练习。'+read())}function home(){clearTimeout(timer);speechSynthesis.cancel();$('z').classList.add('hide');$('r').classList.add('hide');$('h').classList.remove('hide')}function voice(){let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;let r=new S();r.lang='zh-CN';r.onresult=e=>{let s=e.results[0][0].transcript,i=/[1一]/.test(s)?0:/[2二两]/.test(s)?1:/[3三]/.test(s)?2:/[4四]/.test(s)?3:/[5五]/.test(s)?4:-1;if(i>=0)ans(i)};say(read(),()=>r.start())}</script>
